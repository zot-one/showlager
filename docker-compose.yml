services:
  pocketbase:
    build: .
    image: showtechnik-inventar:0.40.5
    container_name: showtechnik-inventar
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_public:/pb/pb_public:ro
      - ./pb_hooks:/pb/pb_hooks:ro
      - ./pb_migrations:/pb/pb_migrations:ro
